<div class="app-container">
  <div class="calendar-container">
    <hijri-gregorian-datepicker [canChangeMode]="true" [todaysDateSection]="false" [futureValidation]="false"
      [pastDateValidation]="false" [pastDateValidationMessage]="true"
      [pastDateValidationMessageEn]="'Selected date cannot be in the past!'"
      [pastDateValidationMessageAr]="'التاريخ المحدد لا يمكن ان يكون في الماضي!'" [disableYearPicker]="false"
      [disableMonthPicker]="false" [disableDayPicker]="false" [multiple]="false" [isRequired]="true"
      [showConfirmButton]="true" [markToday]="true" [mode]="mode" [dir]="'ltr'" [locale]="'en'"
      [submitTextButton]="'Confirm'" [todaysDateText]="'Today\'s Date'" [umAlQuraDateText]="'Hijri Date'"
      [yearSelectLabel]="'Year'" [monthSelectLabel]="'Month'"
      [futureValidationMessageEn]="'Selected date cannot be in the future!'" [futureValidationMessageAr]="
        'التاريخ المحدد لا يمكن ان يكون في المستقبل!'
      " [pastYearsLimit]="134" [futureYearsLimit]="1" [rangeSelection]="false" [theme]="'Steel Grey'"
      [styles]="stylesConfig" (onSubmit)="onSubmit($event)" (onDaySelect)="onChange($event)"
      (onMonthChange)="onMonthChangeTest($event)"
      (onYearChange)="onYearChangeTest($event)"></hijri-gregorian-datepicker>
  </div>

  <div class="event-container">
    @if ((selectedDate | json) != '{}') {
    <p>
      {{ selectedDate | json }}
    </p>
    }
  </div>
</div>
